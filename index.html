<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A spasso per il mondo</title>
  <meta name="description" content="La mappa dei posti che abbiamo visitato insieme">
  <meta name="theme-color" content="#1e5a96">

  <!-- Installazione su Android -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Installazione su iPhone ("Aggiungi alla schermata Home") -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A spasso">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="barra">
    <h1>A spasso per il mondo</h1>
    <div class="azioni">
      <button id="btn-aggiorna" class="btn-tondo" aria-label="Aggiorna l'app">⟳</button>
      <button id="btn-elenco" class="btn-tondo" aria-label="Elenco dei posti">☰</button>
    </div>
  </header>

  <div id="mappa"></div>

  <div id="versione"></div>

  <!-- Elenco dei posti -->
  <aside id="elenco" class="pannello" hidden>
    <div class="pannello-testa">
      <h2><span id="conteggio"></span> posti insieme</h2>
      <button class="btn-chiudi" data-chiudi="elenco" aria-label="Chiudi">✕</button>
    </div>
    <ul id="lista-posti"></ul>
  </aside>

  <!-- Scheda del singolo posto -->
  <section id="scheda" class="pannello" hidden>
    <div class="maniglia"></div>
    <div class="pannello-testa">
      <h2><span id="scheda-emoji"></span> <span id="scheda-nome"></span></h2>
      <button class="btn-chiudi" data-chiudi="scheda" aria-label="Chiudi">✕</button>
    </div>
    <p id="scheda-data" class="data"></p>
    <p id="scheda-nota" class="nota"></p>

    <div id="scheda-tappe-box">
      <h3>📍 Tappe</h3>
      <ul id="scheda-tappe" class="tappe"></ul>
      <button id="btn-aggiungi-tappa" class="btn-secondario">+ Aggiungi tappa</button>
    </div>

    <h3>📷 Foto</h3>
    <div id="scheda-foto" class="galleria"></div>

    <h3>🎵 La nostra canzone</h3>
    <div id="scheda-musica"></div>
  </section>

  <!-- Nuova tappa -->
  <section id="nuova-tappa" class="pannello compatto" hidden>
    <div class="pannello-testa">
      <h2 id="nt-titolo">Nuova tappa</h2>
    </div>
    <div class="riga">
      <input id="nt-nome" type="text" placeholder="Nome (es. Scicli)" autocomplete="off">
      <button id="nt-cerca" class="btn-secondario stretto" aria-label="Cerca">🔍</button>
    </div>
    <p id="nt-stato" class="data"></p>
    <input id="nt-nota" type="text" placeholder="Nota (facoltativa)" autocomplete="off">
    <p id="nt-errore" class="errore"></p>
    <div class="riga">
      <button id="nt-annulla" class="btn-secondario">Annulla</button>
      <button id="nt-salva" class="btn-primario" disabled>Salva tappa</button>
    </div>
  </section>

  <!-- Codice d'accesso per salvare -->
  <section id="chiave" class="pannello compatto" hidden>
    <div class="pannello-testa">
      <h2>🔑 Codice d'accesso</h2>
      <button class="btn-chiudi" data-chiudi="chiave" aria-label="Chiudi">✕</button>
    </div>
    <p class="data">Serve solo la prima volta su questo telefono, per poter salvare.</p>
    <input id="ch-valore" type="password" placeholder="github_pat_…" autocomplete="off">
    <button id="ch-salva" class="btn-primario">Salva e continua</button>
  </section>

  <!-- Foto a schermo intero -->
  <div id="visore" hidden>
    <img alt="">
    <button class="btn-chiudi" aria-label="Chiudi">✕</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- ?v=8 deve essere uguale al numero in versione.js: così il telefono scarica sempre i file nuovi -->
  <script src="versione.js?v=8"></script>
  <script src="posti.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
