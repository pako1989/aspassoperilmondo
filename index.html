<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A spasso per il mondo</title>
  <meta name="description" content="La mappa dei posti che abbiamo visitato insieme">
  <meta name="theme-color" content="#1e5a96">

  <!-- Installazione su Android -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Installazione su iPhone ("Aggiungi alla schermata Home") -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A spasso">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra">
    <h1>A spasso per il mondo</h1>
    <div class="azioni">
      <button id="btn-aggiorna" class="btn-tondo" aria-label="Aggiorna l'app">⟳</button>
      <button id="btn-elenco" class="btn-tondo" aria-label="Elenco dei posti">☰</button>
    </div>
  </header>

  <div id="mappa"></div>

  <div id="versione"></div>

  <!-- Elenco dei posti -->
  <aside id="elenco" class="pannello" hidden>
    <div class="pannello-testa">
      <h2><span id="conteggio"></span> posti insieme</h2>
      <button class="btn-chiudi" data-chiudi="elenco" aria-label="Chiudi">✕</button>
    </div>
    <ul id="lista-posti"></ul>
  </aside>

  <!-- Scheda del singolo posto -->
  <section id="scheda" class="pannello" hidden>
    <div class="maniglia"></div>
    <div class="pannello-testa">
      <h2><span id="scheda-emoji"></span> <span id="scheda-nome"></span></h2>
      <button class="btn-chiudi" data-chiudi="scheda" aria-label="Chiudi">✕</button>
    </div>
    <p id="scheda-data" class="data"></p>
    <p id="scheda-nota" class="nota"></p>

    <div id="scheda-tappe-box">
      <h3>📍 Tappe</h3>
      <ul id="scheda-tappe" class="tappe"></ul>
    </div>

    <h3>📷 Foto</h3>
    <div id="scheda-foto" class="galleria"></div>

    <h3>🎵 La nostra canzone</h3>
    <div id="scheda-musica"></div>
  </section>

  <!-- Foto a schermo intero -->
  <div id="visore" hidden>
    <img alt="">
    <button class="btn-chiudi" aria-label="Chiudi">✕</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="versione.js"></script>
  <script src="posti.js"></script>
  <script src="app.js"></script>
</body>
</html>
